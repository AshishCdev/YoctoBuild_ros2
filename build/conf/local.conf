LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

# Target Hardware Configuration
MACHINE = "raspberrypi5"

# PREEMPT_RT Kernel Configuration
PREFERRED_PROVIDER_virtual/kernel = "linux-raspberrypi"
LINUX_KERNEL_TYPE = "preempt-rt"

# ROS 2 Distribution
ROS_DISTRO = "jazzy"

# Init System (systemd recommended for ROS 2)
INIT_MANAGER = "systemd"

# Boot image type and basic peripheral setup
IMAGE_FSTYPES = "wic.bz2"
ENABLE_UART = "1"
GPU_MEM = "128"

# Enable PCIe x1 on RPi 5 (useful for NVMe drives)
RPI_EXTRA_CONFIG = ' \n \
    dtparam=pciex1 \n \
    '

# Packages to install into the image
IMAGE_INSTALL:append = " \
    rt-tests \
    stress-ng \
    ros-base \
    demo-nodes-cpp \
    demo-nodes-py \
    ros2launch \
    openssh \
    iproute2 \
"

# Free space allocation on rootfs for ROS workspace development (in KB)
IMAGE_ROOTFS_EXTRA_SPACE = "4194304"

# Force glibc to compile using a single thread to avoid race conditions
PARALLEL_MAKE:pn-glibc = "-j 1"
